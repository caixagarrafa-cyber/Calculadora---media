<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Calculadora de média com divisão automática por 1,162.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Calculadora de Média</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f8;--card:#fff;--text:#111827;--muted:#64748b;--border:#d9dee7;--accent:#2563eb;--accent2:#1d4ed8}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111827;--text:#f8fafc;--muted:#94a3b8;--border:#263244;--accent:#60a5fa;--accent2:#3b82f6}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;justify-content:center;padding:20px 14px calc(28px + env(safe-area-inset-bottom))}
main{width:min(100%,520px)}
header{padding:12px 4px 18px}h1{font-size:27px;margin:0 0 6px}p{margin:0;color:var(--muted);line-height:1.45}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 6px 22px #0000000b}
label{display:block;font-weight:700;margin-bottom:8px}
textarea{width:100%;min-height:132px;border:1px solid var(--border);border-radius:14px;background:transparent;color:var(--text);padding:14px;font-size:18px;outline:none;resize:vertical}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.actions{display:flex;gap:10px;margin-top:12px}
button{min-height:48px;border-radius:13px;padding:0 18px;border:1px solid var(--border);font-size:16px;font-weight:700;background:transparent;color:var(--text);cursor:pointer;touch-action:manipulation}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:1}
button.primary:active{background:var(--accent2)}
.status{min-height:22px;margin-top:10px;font-size:14px;color:var(--muted)}
.results{display:grid;grid-template-columns:1fr;gap:10px}
.result{border:1px solid var(--border);border-radius:15px;padding:14px}
.result .label{font-size:13px;color:var(--muted);margin-bottom:5px}
.value{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.highlight{border-color:color-mix(in srgb,var(--accent) 45%,var(--border));background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.formula{text-align:center;font-size:14px;color:var(--muted);margin-top:12px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:4px}
@media(min-width:440px){.results{grid-template-columns:1fr 1fr}.result:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<main>
<header>
<h1>Calculadora de Média</h1>
<p>Digite os números separados por espaço, vírgula ou quebra de linha.</p>
</header>

<section class="card">
<label for="numbers">Números</label>
<textarea id="numbers" inputmode="decimal" autocomplete="off" placeholder="Ex.: 10 12 15 18 20" aria-describedby="hint"></textarea>
<p id="hint" class="status">O cálculo é atualizado automaticamente.</p>
<div class="actions">
<button class="primary" id="calculate" type="button">Calcular</button>
<button id="clear" type="button">Limpar</button>
</div>
</section>

<section class="card" aria-live="polite">
<div class="results">
<div class="result"><div class="label">Quantidade</div><div class="value" id="count">0</div></div>
<div class="result"><div class="label">Média</div><div class="value" id="mean">—</div></div>
<div class="result highlight"><div class="label">Média ÷ 1,162</div><div class="value" id="final">—</div></div>
</div>
<div class="formula">Resultado final = média dos números ÷ 1,162</div>
</section>
<footer>Calculadora de Média • funciona localmente no dispositivo</footer>
</main>
<script>
(() => {
  const input=document.querySelector("#numbers"), count=document.querySelector("#count");
  const mean=document.querySelector("#mean"), final=document.querySelector("#final");
  const hint=document.querySelector("#hint"), calc=document.querySelector("#calculate");
  const clear=document.querySelector("#clear");

  function parseValues(){
    const raw=input.value.trim();
    if(!raw) return {values:[],invalid:false};
    const tokens=raw.split(/[\s,;]+/).filter(Boolean);
    const values=tokens.map(t=>Number(t.replace(",", ".")));
    return {values:values.filter(Number.isFinite),invalid:values.some(v=>!Number.isFinite(v))};
  }
  function fmt(n){return n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});}
  function calculate(){
    const {values,invalid}=parseValues();
    if(!input.value.trim()){
      count.textContent="0"; mean.textContent="—"; final.textContent="—";
      hint.textContent="Digite pelo menos um número."; return;
    }
    if(invalid || !values.length){
      count.textContent="0"; mean.textContent="—"; final.textContent="—";
      hint.textContent="Há um valor inválido. Confira os números digitados."; return;
    }
    const avg=values.reduce((a,b)=>a+b,0)/values.length;
    count.textContent=String(values.length);
    mean.textContent=fmt(avg);
    final.textContent=fmt(avg/1.162);
    hint.textContent="Cálculo atualizado.";
  }
  calc.addEventListener("click",calculate);
  input.addEventListener("input",calculate);
  clear.addEventListener("click",()=>{input.value="";count.textContent="0";mean.textContent="—";final.textContent="—";hint.textContent="Digite os números separados por espaço, vírgula ou quebra de linha.";input.focus();});
  if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("service-worker.js").catch(()=>{}));}
})();
</script>
</body>
</html>
